; PlatformIO Project Configuration for Tuya TYWE1S (ESP8266EX)
; Standalone Wi-Fi Web Server & REST API Gateway

[platformio]
default_envs = tywe1s_wifi
src_dir = src

[env:tywe1s_wifi]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
    -D BEARSSL_SSL_BASIC
    -O2
