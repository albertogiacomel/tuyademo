; PlatformIO Project Configuration File for Tuya TYDE 3.0 IoT Dev Kit
; Reference: SOUL_GLOBAL methodology & Codex CLI Embedded Architecture (Vaughan 2026)

[platformio]
default_envs = stm32_bridge
src_dir = src
include_dir = include

[env:stm32_bridge]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
build_flags =
    -D SERIAL_UART_INSTANCE=1
    -D ENABLE_HWSERIAL3
    -O2
